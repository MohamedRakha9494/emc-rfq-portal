<style>

:root {

  --info: #24548f; --info-soft: #e4edf8; --rail: #0d2430; --rail-ink: #cfe0e5; --rail-active: #17414f;
  --font: "IBM Plex Sans Arabic", "Segoe UI", "Noto Sans Arabic", Tahoma, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

}

  --warn: #f0b04a; --warn-soft: #3a2a0d; --bad: #f08a80; --bad-soft: #3d1715; --ok: #5fd39c; --ok-soft: #10301f;
  --info: #8fb8ee; --info-soft: #14263c; --rail: #07111a; --rail-ink: #b9cdd3; --rail-active: #15303b;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b161b; --surface: #112128; --surface-2: #0e1c22; --ink: #e2edf0; --ink-2: #9db3bb; --line: #23394240;
  --accent: #3cb7ad; --accent-ink: #062320; --accent-soft: #123a37;
  --warn: #f0b04a; --warn-soft: #3a2a0d; --bad: #f08a80; --bad-soft: #3d1715; --ok: #5fd39c; --ok-soft: #10301f;

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }

.notice.bad { background: var(--bad-soft); border-inline-start: 4px solid var(--bad); }
.notice.ok { background: var(--ok-soft); border-inline-start: 4px solid var(--ok); }

.catalog { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

.field { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px dashed var(--line); scroll-margin-top: 90px; }

async function refreshTokens(sess) {   // returns new tokens; throws NetError (keep session) or Error('RFQ_SESSION_ENDED')
  const r = await netFetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: CFG.anon, 'content-type': 'application/json' }, body: JSON.stringify({ refresh_token: sess.refresh_token }) });
  if (TEMP_STATUS.includes(r.status) || r.status >= 500) throw new NetError('RFQ_NETWORK: token refresh HTTP ' + r.status);
  const b = await r.json().catch(() => null);
  if (!r.ok || !b?.access_token) throw new Error('RFQ_SESSION_ENDED');
  return b;
}
async function ensureFresh() {
  if (!S.user?.refresh_token || !S.user.expires_at || S.user.expires_at * 1000 - Date.now() > 60000) return;
  refreshing ||= (async () => {
    let b;
    try { b = await refreshTokens(S.user); }
    catch (e) { if (!isNet(e)) sessionEnded(isCode() ? 'ended' : null); throw e; }
    Object.assign(S.user, { access_token: b.access_token, refresh_token: b.refresh_token, expires_at: b.expires_at }); store.set(SESSION_KEY, S.user);
  })().finally(() => { refreshing = null; });
  await refreshing;
}
async function http(method, path, { body, prefer, bearer } = {}) {
  const h = { apikey: CFG.anon, 'content-type': 'application/json' };
  if (bearer) h.authorization = 'Bearer ' + bearer; else if (S.user?.access_token) { await ensureFresh(); h.authorization = 'Bearer ' + S.user.access_token; }
  if (prefer) h.prefer = prefer;
  const r = await netFetch(CFG.url + path, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) });
  if (TEMP_STATUS.includes(r.status)) throw new NetError('RFQ_NETWORK: HTTP ' + r.status);
  const txt = await r.text(); let b = null; try { b = txt ? JSON.parse(txt) : null; } catch { b = txt; }
  if (!r.ok) {
    const msg = (b && typeof b === 'object' && (b.error && /^RFQ_/.test(b.error) ? b.error : (b.message || b.msg || b.error_description || b.error))) || ('HTTP ' + r.status);
    if (/RFQ_ACCESS_CODE_ENDED/.test(msg) && isCode()) sessionEnded('ended');
    if (r.status === 401 && /JWT|jwt|token/.test(msg) && S.user) sessionEnded(isCode() ? 'ended' : null);
    const e = new Error(msg); e.status = r.status; throw e;
  }
  return b;
}
const api = {
  get: (path) => http('GET', '/rest/v1/' + path),
  insert: async (table, row) => (await http('POST', '/rest/v1/' + table, { body: Object.fromEntries(Object.entries(row).map(([k, v]) => [k, v === '' ? null : v])), prefer: 'return=representation' }))[0],
  rpc: async (fn, args = {}) => http('POST', '/rest/v1/rpc/' + fn, { body: args }),
};
const inList = (ids) => '(' + ids.map((x) => '"' + x + '"').join(',') + ')';
const FALLBACK = { RFQ_ACCESS_CODE_INVALID: { en: 'This access code is not valid. Check it or ask EMC for a new one.', ar: 'كود الدخول غير صحيح. راجع الكود أو اطلب كودًا جديدًا من EMC.' },

const msgOf = (code) => S.catalog[code] || FALLBACK[code];
function errText(e) {
  const m = String(e?.message || e); const code = (m.match(/RFQ_[A-Z_]+/) || [])[0];
  if (code && msgOf(code)) return pick(msgOf(code));
  if (/permission denied|row-level security/i.test(m)) return pick(msgOf('RFQ_ACCESS_DENIED'));
  if (isNet(e) || /RFQ_NETWORK|Failed to fetch|NetworkError/i.test(m)) return t('offlineShort');
  return m.replace(/^error:\s*/i, '');
}

async function loadCommon() {

  for (const r of cat || []) S.catalog[r.code] = { code: r.code, en: r.message_en || r.default_en, ar: r.message_ar || r.default_ar };
  S.products = (prods || []).map((p) => { const fs = (flds || []).filter((f) => f.product_id === p.id);
    return { ...p, nfields: fs.length, nreq: fs.filter((f) => f.requirement === 'required').length, nreqnum: fs.filter((f) => f.requirement === 'required' && ['number', 'number_range'].includes(f.data_type)).length }; });

async function boot() {
  bootRender();

    const c = await (await fetch('config.json', { cache: 'no-store' })).json(); CFG.url = (c.supabase_url || '').replace(/\/$/, ''); CFG.anon = c.anon_key; CFG.env = c.environment || 'production'; CFG.demoAccounts = Array.isArray(c.demo_accounts) ? c.demo_accounts : []; if (c.portal_url) CFG.portal = c.portal_url;
    if (CFG.env === 'local-test') { try { S.sys = await (await fetch('stack-info.json', { cache: 'no-store' })).json(); } catch { S.sys = {}; } } else S.sys = {};   // review S3
    flushPendingSignOut();
    addEventListener('online', () => { flushPendingSignOut(); if (S.offline && S.user) retryConnection(); });
    const saved = store.get(SESSION_KEY);
    if (saved?.access_token) { S.user = saved;
      try {
        const st = isCode() ? await checkCodeSession(true) : 'active';
        if (st === 'ended') { S.user = null; S.loginNote = 'ended'; }
        else if (st === 'active') await loadCommon();
        else S.offline = true;                                   // v1.4: network problem: keep the session, show offline
      } catch (e) { console.warn(e); if (isNet(e)) S.offline = true; else { S.user = null; store.set(SESSION_KEY, null); } } }

/* ------------------------------------------------------------------ sign-in
   Staff: Supabase Auth e-mail + password. Customers: access code only — the Edge Function "customer-access"
   checks the code in the database and returns a normal Supabase session for this device. The session is kept
   on the device (localStorage, as supabase-js does) and every request is checked again on the server. */
const isStaff = () => S.user && S.user.kind !== 'code' && (S.user.role === 'admin' || S.user.role === 'engineer');
const isCode = () => S.user?.kind === 'code';
const SESSION_KEY = 'emc.session.v1-2';
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
// v1.3 (review S2): no account or password is written in this page; a LOCAL test config.json may list test staff accounts
async function staffSignIn(email, pw) {
  let b; try { b = await http('POST', '/auth/v1/token?grant_type=password', { body: { email: email.trim(), password: pw } }); } catch { throw new Error(t('badLogin')); }
  S.user = { id: b.user.id, email: b.user.email, kind: 'staff', access_token: b.access_token, refresh_token: b.refresh_token, expires_at: b.expires_at };
  const p = (await api.get(`rfq_profiles?user_id=eq.${b.user.id}&select=role,display_name`))[0];
  if (!p || !['admin', 'engineer'].includes(p.role)) { try { await http('POST', '/auth/v1/logout'); } catch {} S.user = null; throw new Error(t('staffOnlyLogin')); }
  S.user.role = p.role; S.user.name = p.display_name || b.user.email; store.set(SESSION_KEY, S.user); await loadCommon();
}
function setCodeSession(r) {
  Object.assign(S.user, { kind: 'code', role: 'customer', name: r.company_name, company: r.company_name, scope: r.scope, project_name: r.project_name, expires_at_code: r.expires_at, hint: r.code_hint });
  store.set(SESSION_KEY, S.user);
}
async function codeSignIn(code) {
  if (!code.trim()) throw new Error(t('enterCode'));
  const r = await netFetch(CFG.url + '/functions/v1/customer-access', { method: 'POST', headers: { apikey: CFG.anon, 'content-type': 'application/json' }, body: JSON.stringify({ code }) });
  if ([502, 504].includes(r.status)) throw new NetError('RFQ_NETWORK: HTTP ' + r.status);
  const b = await r.json().catch(() => ({}));
  if (!r.ok || !b.access_token) throw new Error(pick(msgOf(b.error) || msgOf('RFQ_ACCESS_CODE_INVALID')));
  S.user = { id: b.user_id, kind: 'code', role: 'customer', access_token: b.access_token, refresh_token: b.refresh_token, expires_at: b.expires_at };
  setCodeSession(b.portal); await loadCommon();
}
// v1.4: 'active' | 'ended' | 'offline'. Only the server's answer ends the session; a network problem never does.
async function checkCodeSession(login) {
  try {
    const r = await api.rpc('rfq_access_code_session', { p_login: !!login });
    if (r?.active) { setCodeSession(r); return 'active'; }
  } catch (e) {
    if (isNet(e)) return 'offline';
    if (!/RFQ_ACCESS_CODE_ENDED|RFQ_SESSION_ENDED|JWT|jwt|token/.test(e.message)) { console.warn(e.message); return 'offline'; }
  }
  store.set(SESSION_KEY, null); return 'ended';
}
let ending = false;
function sessionEnded(note) { if (ending) return; ending = true; S.user = null; store.set(SESSION_KEY, null); S.loginNote = note; setTimeout(() => { ending = false; go('login'); }, 0); }
// v1.4: the device is signed out at once; if the server cannot be reached, the server-side sign-out is kept as
// "pending" on this device and sent when the connection is back (the session would otherwise stay open on the server)
const PENDING_KEY = 'emc.pending_signout.v1-4';
async function serverSignOut(sess) {   // true when the server has ended (or had already ended) the session
  let tok = sess.access_token;
  try {
    if (sess.expires_at && sess.expires_at * 1000 - Date.now() < 60000) tok = (await refreshTokens(sess)).access_token;
  } catch (e) { if (isNet(e)) throw e; return true; }                // refresh refused: the session is already over
  const call = async (path) => { const r = await netFetch(CFG.url + path, { method: 'POST', headers: { apikey: CFG.anon, authorization: 'Bearer ' + tok, 'content-type': 'application/json' }, body: '{}' });
    if (TEMP_STATUS.includes(r.status) || r.status >= 500) throw new NetError('RFQ_NETWORK: HTTP ' + r.status); return r; };
  if (sess.kind === 'code') await call('/rest/v1/rpc/rfq_access_code_sign_out');   // 403 ENDED = already over: fine
  await call('/auth/v1/logout');
  return true;
}
async function flushPendingSignOut() {
  const p = store.get(PENDING_KEY); if (!p?.access_token) return;
  try { if (await serverSignOut(p)) store.set(PENDING_KEY, null); } catch (e) { if (!isNet(e)) store.set(PENDING_KEY, null); }
}
async function signOut() {
  const sess = S.user; S.user = null; store.set(SESSION_KEY, null); S.loginNote = null; S.offline = false;
  if (sess?.access_token) {
    try { await serverSignOut(sess); }
    catch (e) { if (isNet(e)) { store.set(PENDING_KEY, { kind: sess.kind, access_token: sess.access_token, refresh_token: sess.refresh_token, expires_at: sess.expires_at }); S.loginNote = 'pending_signout'; } }
  }
  go('login');
}

/* ------------------------------------------------------------------ UI helpers */
// v1.4: retry after a network problem: ask the server again whether the session is still valid, then reload the page data
async function retryConnection() {
  if (!S.user) return go('login');
  try {
    const st = isCode() ? await checkCodeSession(false) : 'active';
    if (st === 'ended') return sessionEnded('ended');
    if (st === 'offline') { S.offline = true; return render(); }
    if (!S.products.length) await loadCommon();
    S.offline = false;
  } catch (e) { if (isNet(e)) S.offline = true; else console.warn(e); }
  render();
}

function frost(cv) { // quiet ambient: drifting frost particles over a cold-room grid
  if (!cv) return; const c = cv.getContext('2d'); const dpr = Math.min(2, devicePixelRatio || 1); let W, H, pts;
  const size = () => { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0);
    pts = Array.from({ length: Math.round(W * H / 9000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + .3, v: Math.random() * .25 + .05 })); };
  size(); addEventListener('resize', size);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const draw = () => { c.clearRect(0, 0, W, H); c.strokeStyle = 'rgba(120,190,200,.08)'; c.lineWidth = 1;
    for (let x = 0; x < W; x += 48) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); } for (let y = 0; y < H; y += 48) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    c.fillStyle = 'rgba(200,236,240,.7)'; for (const p of pts) { c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.3); c.fill(); if (!still) { p.y += p.v; p.x += Math.sin(p.y / 40) * .15; if (p.y > H) { p.y = -2; p.x = Math.random() * W; } } }
    if (!still && document.body.contains(cv)) requestAnimationFrame(draw); };
  draw();
}

    if (['number', 'number_range'].includes(f.data_type)) return `<input id="${id}" type="text" disabled placeholder="${esc(f.unit || '')}"><div class="help">🔒 ${esc(t('numLocked'))}</div>`;
    if (f.data_type === 'file') return `<input id="${id}" type="text" disabled><div class="help">🔒 ${esc(t('fileLocked'))}</div>`;
    let h = '';
    const optLabel = (o) => S.lang === 'ar' ? (o.ar || o.en) : o.en;
    if (f.data_type === 'text') h = `<input id="${id}" type="text" data-f="${f.id}" data-k="text" value="${esc(typeof v === 'string' ? v : '')}">`;
    else if (f.data_type === 'textarea') h = `<textarea id="${id}" data-f="${f.id}" data-k="text">${esc(typeof v === 'string' ? v : '')}</textarea>`;
    else if (f.data_type === 'boolean') h = `<div class="opts">${[[true, t('yes')], [false, t('no')]].map(([b, l]) => `<label><input type="radio" name="${id}" data-f="${f.id}" data-k="bool" value="${b}" ${v === b ? 'checked' : ''}> ${esc(l)}</label>`).join('')}</div>`;
    else if (f.data_type === 'select') { const cur = v && typeof v === 'object' ? v.value : v; const curOpt = (f.options_json || []).find((o) => o.value === cur);
      h = `<select id="${id}" data-f="${f.id}" data-k="select"><option value="">—</option>${(f.options_json || []).map((o) => `<option value="${esc(o.value)}" ${o.value === cur ? 'selected' : ''}>${esc(optLabel(o))}</option>`).join('')}</select>
        <input type="text" id="${id}-tx" data-f="${f.id}" data-k="seltext" placeholder="${esc(t('otherText'))}" value="${esc(v && typeof v === 'object' ? v.text || '' : '')}" ${curOpt?.text ? '' : 'hidden'}>`; }
    else if (f.data_type === 'multiselect') { const arr = (Array.isArray(v) ? v : []).map((x) => typeof x === 'object' ? x.value : x);
      h = `<div class="opts" id="${id}">${(f.options_json || []).map((o) => `<label><input type="checkbox" data-f="${f.id}" data-k="multi" value="${esc(o.value)}" ${arr.includes(o.value) ? 'checked' : ''}> ${esc(optLabel(o))}</label>`).join('')}</div>`; }
    else h = `<input id="${id}" type="text" data-f="${f.id}" data-k="text" value="${esc(typeof v === 'string' ? v : '')}">`;
    if (f.allow_not_known) h += `<label class="small"><input type="checkbox" data-f="${f.id}" data-k="nk" ${nk ? 'checked' : ''}> ${esc(t('notKnown'))}</label>`;
    return h;
  };
  const answered = () => fields.filter((f) => A[f.id] !== undefined && A[f.id] !== null).length;
  el.innerHTML = `<div class="row"><button class="btn sm" data-go="home">← ${esc(t('back'))}</button>${chip('draft')}<span class="muted small">${esc(prodName(prodById(it.product_id)))}</span><span class="muted small">· ${esc(t('draftNote'))}</span></div>
    ${prior?.info_request_message ? `<div class="notice warn"><b>${esc(t('infoRequest'))}</b><span>${esc(prior.info_request_message)}</span></div>` : ''}
    <div class="formlayout"><div class="stack">
      <section class="panel" id="sec-project"><div class="panel-head"><h2>${esc(t('projectDetails'))}</h2></div>
        <form id="prf" class="grid2" novalidate>
        ${[['contact_name', 'contactName'], ['contact_email', 'contactEmail'], ['contact_phone', 'contactPhone'], ['customer_reference', 'customerRef'], ['site_country', 'siteCountry'], ['site_city', 'siteCity'], ['site_address', 'siteAddress']].map(([k, l]) => `<label class="f" for="pj-${k}">${esc(t(l))}<input id="pj-${k}" type="${k === 'contact_email' ? 'email' : 'text'}" value="${esc(proj[k] || '')}"></label>`).join('')}
        <label class="f" for="pj-project_type">${esc(t('projectType'))}<select id="pj-project_type">${PTYPES.map((x) => `<option value="${x}" ${proj.project_type === x ? 'selected' : ''}>${esc(t('type.' + x))}</option>`).join('')}</select></label>
        <label class="f" for="pj-site_status">${esc(t('siteStatus'))}<select id="pj-site_status"><option value="">—</option>${SITES.map((x) => `<option value="${x}" ${proj.site_status === x ? 'selected' : ''}>${esc(t('siteSt.' + x))}</option>`).join('')}</select></label>
        <label class="f" for="pj-requested_delivery">${esc(t('delivery'))}<input id="pj-requested_delivery" type="date" value="${esc(proj.requested_delivery || '')}"></label>
        <div class="row" style="align-self:end"><button class="btn">${esc(t('saveProject'))}</button></div></form></section>
      ${secs.map((s, si) => `<section class="panel" id="sec-${si}"><h2>${esc(secName(s))}</h2><div class="fieldset">${fields.filter((f) => f.section === s).map((f) => `<div class="field" id="wrap-${f.field_key}">
        <label class="lbl" for="fld-${f.id}">${esc(pick(f, 'label_en', 'label_ar'))} ${reqTag(f.requirement)}</label>${pick(f, 'help_en', 'help_ar') ? `<div class="help">${esc(pick(f, 'help_en', 'help_ar'))}</div>` : ''}
        ${input(f)}<div class="state" id="st-${f.id}" aria-live="polite"></div></div>`).join('')}</div></section>`).join('')}
    </div>
    <aside class="side">
      <section class="panel"><h3>${esc(t('progress'))}</h3><div class="bar"><i id="pbar" style="width:${Math.round(answered() / fields.length * 100)}%"></i></div><div class="small muted" id="pnum">${answered()} / ${fields.length}</div>
        <nav class="stack small"><a href="#" data-jump="sec-project">${esc(t('projectDetails'))}</a>${secs.map((s, i) => `<a href="#" data-jump="sec-${i}">${esc(secName(s))}</a>`).join('')}</nav></section>
      <section class="panel"><div class="panel-head"><h3>${esc(t('checkResult'))}</h3><div class="actions"><button class="btn sm" id="chk">${esc(t('check'))}</button></div></div><div id="issues" class="issues"><span class="muted small">—</span></div></section>
      <section class="panel"><label class="small row" style="align-items:flex-start;flex-wrap:nowrap"><input type="checkbox" id="decl"> <span>${esc(t('declaration'))}</span></label>
        <label class="small row" style="align-items:flex-start;flex-wrap:nowrap"><input type="checkbox" id="ackw"> <span>${esc(t('ackWarnings'))}</span></label>
        <button class="btn primary" id="sub">${esc(t('submit'))}</button><div id="suberr" class="small" style="color:var(--bad)" role="alert"></div></section>
    </aside></div>`;
  // autosave
  const timers = {};
  const setState = (fid, cls, txt) => { const s = $('#st-' + fid); if (s) { s.className = 'state ' + cls; s.textContent = txt; } };
  const valueOf = (fid) => {
    const f = fields.find((x) => x.id === fid); const nk = el.querySelector(`[data-f="${fid}"][data-k="nk"]`);
    if (nk && nk.checked) return { status: 'not_known' };
    if (f.data_type === 'boolean') { const r = el.querySelector(`[data-f="${fid}"][data-k="bool"]:checked`); return r ? r.value === 'true' : null; }
    if (f.data_type === 'select') { const sv = $('#fld-' + fid).value; const o = (f.options_json || []).find((x) => x.value === sv); const tx = $('#fld-' + fid + '-tx');
      tx.hidden = !o?.text; if (!sv) return null; return o?.text && tx.value.trim() ? { value: sv, text: tx.value.trim() } : sv; }
    if (f.data_type === 'multiselect') { const a = [...el.querySelectorAll(`[data-f="${fid}"][data-k="multi"]:checked`)].map((x) => x.value); return a.length ? a : null; }
    return $('#fld-' + fid).value;
  };
  const save = async (fid) => {
    const v = valueOf(fid); setState(fid, 'busy', t('saving'));
    try { await api.rpc('rfq_upsert_answer', { p_revision_equipment_id: it.id, p_field_id: fid, p_value: jsonArg(v === '' ? null : v) }, 'void');
      if (v === null || v === '' || (Array.isArray(v) && !v.length)) delete A[fid]; else A[fid] = v; setState(fid, 'ok', '✓ ' + t('saved'));
      $('#pbar').style.width = Math.round(answered() / fields.length * 100) + '%'; $('#pnum').textContent = answered() + ' / ' + fields.length; }
    catch (er) { setState(fid, 'bad', errText(er)); }
  };
  el.querySelectorAll('[data-f]').forEach((inp) => {
    const fid = inp.dataset.f; const k = inp.dataset.k;
    if (k === 'text' || k === 'seltext') { inp.addEventListener('input', () => { clearTimeout(timers[fid]); setState(fid, 'busy', '…'); timers[fid] = setTimeout(() => save(fid), 700); }); inp.addEventListener('blur', () => { if (timers[fid]) { clearTimeout(timers[fid]); timers[fid] = null; save(fid); } }); }
    else inp.addEventListener('change', () => save(fid));
  });
  el.querySelectorAll('[data-jump]').forEach((a) => a.onclick = (e) => { e.preventDefault(); $('#' + a.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  $('#prf').onsubmit = async (e) => { e.preventDefault();
    const keys = ['contact_name', 'contact_email', 'contact_phone', 'customer_reference', 'site_country', 'site_city', 'site_address', 'project_type', 'site_status', 'requested_delivery'];
    const patch = Object.fromEntries(keys.map((k) => [k, $('#pj-' + k).value.trim() || null]));
    try { await api.rpc('rfq_update_project', { p_project_id: q.project_id, p_patch: jsonArg(patch) }, 'void'); toast(t('projectSaved')); } catch (er) { toast(errText(er), true); } };
  const check = async () => {
    const rows = await api.rpc('rfq_validate_revision', { p_revision_id: rev.id }, 'rows'); const box = $('#issues');
    const errs = rows.filter((r) => r.severity === 'error'); const warns = rows.filter((r) => r.severity !== 'error');
    box.innerHTML = (!errs.length ? `<div class="notice ok small">${esc(t('allGood'))}</div>` : '') + rows.map((r) => `<button class="issue ${r.severity === 'error' ? 'error' : 'warning'}" data-key="${esc(r.field_key || '')}"><b>${esc(r.severity === 'error' ? t('blocking') : t('warnings'))}</b><span>${esc((S.lang === 'ar' ? r.label_ar || r.label_en : r.label_en) || r.field_key)}</span><span class="muted">${esc(S.catalog[r.code] ? pick(S.catalog[r.code]) : r.code)}</span></button>`).join('');
    box.querySelectorAll('.issue').forEach((b) => b.onclick = () => { const k = b.dataset.key; const w = k.startsWith('project.') ? $('#sec-project') : $('#wrap-' + k); if (w) { w.scrollIntoView({ behavior: 'smooth', block: 'center' }); w.classList.remove('flash'); void w.offsetWidth; w.classList.add('flash'); } });
    return { errs, warns };
  };
  $('#chk').onclick = () => check().catch((er) => toast(errText(er), true));
  $('#sub').onclick = async () => { $('#suberr').textContent = '';
    try { await api.rpc('rfq_submit_revision', { p_revision_id: rev.id, p_customer_declaration: $('#decl').checked, p_acknowledge_warnings: $('#ackw').checked }, 'void'); toast(t('submitted') + ' ✓'); go('rfq', { id: q.id }); }
    catch (er) { $('#suberr').textContent = errText(er); if (errCode(er) === 'RFQ_VALIDATION_FAILED') check(); } };
}

boot();
</script>

</body>
</html>
